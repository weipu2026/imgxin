# 粘贴到 宝塔 → 网站 → img.40404.cn → 设置 → 配置文件 的 server { } 内
# 把 /www/wwwroot/YOUR_SITE 换成实际站点目录
# 后台设置页保存后会按当前白名单生成同一段配置，可直接覆盖这里

# 图片直链：nginx 直接静态下发，不经过 PHP
# 直链形如 /i/{站点}/{YYYYMM}/{id}.webp，alias 指向 storage/ 根即可，
# 站点这一层目录由 URL 自动带出来，以后新增站点不用再改 nginx。
location ^~ /i/ {
    alias /www/wwwroot/YOUR_SITE/storage/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    add_header Access-Control-Allow-Origin "*";
    valid_referers none blocked server_names *.40404.cn;
    if ($invalid_referer) { return 403; }
}

# 上传体积：宝塔默认 http 层 client_max_body_size 是 50m，够用则无需改
# 若单张上限调到 25MB 以上，在 server 内补一行：
# client_max_body_size 100m;

# 站点其他路径保持宝塔默认，不需要改
